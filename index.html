<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Μπούμπας · tomahawk</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    font-family:-apple-system,Arial,sans-serif;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{height:100vh;max-width:100vw;object-fit:contain;display:block;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<script>
const M = {"W":1080,"H":1920,"cx":540,"cy":950,"spw":415,"sph":1040,"tx":333,"ty":430,"bg":[8,8,8]};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W=M.W,H=M.H, CX=M.cx, CY=M.cy, SPW=M.spw, SPH=M.sph, TX=M.tx, TY=M.ty;
const BG = `rgb(${M.bg[0]+2},${M.bg[1]+2},${M.bg[2]+2})`;

const steak = new Image(), outline = new Image(), bg = new Image();
let loaded = 0; const need = 3;
[['steak.png',steak],['outline.png',outline],['bg.jpg',bg]].forEach(([s,img])=>{
  img.onload=()=>{ if(++loaded===need){ reset(); requestAnimationFrame(loop);} }; img.src=s;
});

const BASE_PD = 0.95;        // seconds per fall (medium)
const SPAN = H + 1.2*SPH;
const IDEAL_TOL = 60;        // base perfect-hit window (px) — medium difficulty
const ASSIST_TOL = 165;      // "near ideal" window from the help attempt on
let curPD = BASE_PD;
// after a few tries the game HELPS: falls slow down and the hit window widens,
// so a persistent user is guided to a correct stop.
function pd(){ return attempt < helpAttempt ? BASE_PD : Math.min(1.8, BASE_PD + (attempt-helpAttempt+1)*0.16); }
function hitTol(){
  let tol = IDEAL_TOL + Math.max(0, attempt-3)*14;        // grows every attempt
  if(attempt >= helpAttempt)   tol = Math.max(tol, ASSIST_TOL);
  if(attempt >= helpAttempt+2) tol = Math.max(tol, 300);  // strongly helps to stop correctly
  return tol;
}
const easeIn  = p => Math.pow(p,1.4);
const easeOut = p => 1-Math.pow(1-p,3);

let state, attempt, helpAttempt, passStart, frozenCy, missUntil, winStart, snapFrom;
function reset(){
  state='play'; attempt=1;
  helpAttempt = 7 + Math.floor(Math.random()*3);   // 7, 8 or 9
  passStart = performance.now()/1000 + 0.35;        // small intro
  frozenCy=0; missUntil=0; winStart=0; snapFrom=0; curPD=BASE_PD;
}
function passCy(t){ const p=Math.min(1,Math.max(0,(t-passStart)/curPD)); return -0.6*SPH + easeIn(p)*SPAN; }

function onTap(){
  const t = performance.now()/1000;
  if(state==='play'){
    if(t < passStart) return;
    const cy = passCy(t);
    const off = Math.abs(cy - CY);
    if(off <= hitTol()){
      state='win'; winStart=t; snapFrom=cy;
    } else {
      state='frozenMiss'; frozenCy=cy; missUntil=t+0.75;
    }
  } else if(state==='win'){
    reset();                     // tap again to replay
  }
}
['pointerdown','touchstart','mousedown'].forEach(ev=>
  cv.addEventListener(ev, e=>{ e.preventDefault(); onTap(); }, {passive:false}));

function drawSteak(cy){ ctx.drawImage(steak, TX, Math.round(cy - SPH/2)); }
function drawOutline(mult, tint){
  ctx.save(); ctx.globalAlpha = Math.min(1, mult);
  if(tint){ // red miss tint
    ctx.drawImage(outline, TX, TY);
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(210,60,45,0.85)'; ctx.fillRect(TX,TY,SPW,SPH);
  } else { ctx.drawImage(outline, TX, TY); }
  ctx.restore();
}

function loop(){
  const t = performance.now()/1000;
  ctx.drawImage(bg,0,0,W,H);

  // advance passes automatically while playing
  if(state==='play' && t > passStart + curPD){ attempt++; passStart = t; curPD = pd(); }

  // outline (pulse as steak crosses)
  let pulse=0;
  if(state==='play'){
    const pCross = Math.sqrt((CY+0.6*SPH)/SPAN);
    const tCross = passStart + curPD*pCross;
    pulse = Math.exp(-Math.pow((t-tCross)/0.14,2));
  }
  drawOutline(0.9 + 0.5*pulse, false);

  if(state==='play'){
    if(t>=passStart) drawSteak(passCy(t));
    // pulsing tap-target ring
    const rp=0.5+0.5*Math.sin(t*7.5), rr=300+24*rp;
    ctx.save(); ctx.strokeStyle=`rgba(255,255,255,${0.28+0.3*(1-rp)})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(CX,CY,rr,0,7); ctx.stroke(); ctx.restore();
  }
  else if(state==='frozenMiss'){
    drawOutline(1, true);               // red = off
    drawSteak(frozenCy);
    // marker showing the gap to the ideal line
    ctx.save(); ctx.strokeStyle='rgba(210,60,45,0.9)'; ctx.setLineDash([14,12]); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(CX-150,CY); ctx.lineTo(CX+150,CY); ctx.stroke(); ctx.restore();
    if(t>missUntil){ attempt++; state='play'; passStart=t+0.1; curPD=pd(); }
  }
  else if(state==='win'){
    const w=Math.min(1,(t-winStart)/0.22);
    drawSteak(snapFrom + easeOut(w)*(CY-snapFrom));
    if(t-winStart<0.3){ ctx.save(); ctx.fillStyle=`rgba(255,255,255,${0.55*Math.sin((t-winStart)/0.3*Math.PI)})`; ctx.fillRect(0,0,W,H); ctx.restore(); }
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
